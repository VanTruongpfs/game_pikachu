<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="css/gameScreen.css">
</head>
<body>
    <main class="game-screen">
        <header class="game-header">
            <button class="btn-back">
                <i id="btn-back"  class="fa-solid fa-arrow-left-long"></i>
            </button>
            <div class="level-title">
                <span class="region-name">Kanto </span>
                <h1>Màn 1</h1>
            </div>
            <div class="header-actions">
                <button id="sound-button">
                    <i class="fa-solid fa-volume"></i>
                </button>
                <button id="pause-button">
                    <i class="fa-solid fa-pause"></i>
                </button>
            </div>
        </header>
        <section class="game-info">
            <div>
                <i></i>
                <span>Thời gian</span>
            </div>
            <div>
                <i></i>
                <span>Số cặp</span>
            </div>
            <div>
                <i></i>
                <span>Huy hiệu</span>
            </div>
        </section>

        <section class="game-content">
            <div class="board-wrapper">
                <div id="game-board" class="game-board">
                    <button class="tile">A</button>
                    <button class="tile">A</button>
                    <button class="tile">B</button>
                    <button class="tile">B</button>
                    <button class="tile">C</button>
                    <button class="tile">C</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
