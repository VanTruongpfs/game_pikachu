<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="css/gameScreen.css">
</head>
<body>
    <main class="game-screen">
        <header class="game-header">
            <button class="btn-back">
                <i id="btn-back"  class="fa-solid fa-arrow-left-long"></i>
            </button>
            <div class="level-title">
                <span class="region-name">Kanto </span>
                <h1>Màn 1</h1>
            </div>
            <div class="header-actions">
                <button id="sound-button">
                    <i class="fa-solid fa-volume"></i>
                </button>
                <button id="pause-button">
                    <i class="fa-solid fa-pause"></i>
                </button>
            </div>
        </header>
        <section class="game-info">
            <div>
                <p>Điểm hiện tại</p>
                <p>300</p>
            </div>
            <div>
                <p>Kỉ lục cao nhất</p>
                <p>2000</p>
            </div>
            <div>
                <p>Số cặp</p>
                <p>30</p>
            </div>
            <div>
                <span>Huy hiệu</span>
                <img src="" alt="">
            </div>
        </section>
        <section class="game-progress">
            <div class="progress-heading">
                <label for="time-progress">
                    Thời gian còn lại
                </label>

                <output id="time-left">02:30</output>
            </div>

            <progress id="time-progress" class="progress-track" max="150" value="150">100%</progress>
        </section>
        <section class="game-content">
            <div class="board-wrapper">
                <div id="game-board" class="game-board">
                    <button class="tile">A</button>
                    <button class="tile">A</button>
                    <button class="tile">B</button>
                    <button class="tile">B</button>
                    <button class="tile">C</button>
                    <button class="tile">C</button>
                </div>
            </div>
        </section>
        <footer class="footer-game">
            <div class="container-support">
                <button class="btn-support">
                    <i class="fa-solid fa-question"></i>
                </button>
                <button class="btn-support">
                    <i class="fa-solid fa-question"></i>
                </button>
                <button class="btn-support">
                    <i class="fa-solid fa-question"></i>
                </button>
                <button class="btn-support">
                    <i class="fa-solid fa-question"></i>
                </button>
            </div>
        </footer>
    </main>
</body>
</html>
